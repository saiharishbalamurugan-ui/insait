version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: audix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: audix
      POSTGRES_PASSWORD: audix_dev_password
      POSTGRES_DB: audix
    ports:
      - "5432:5432"
    volumes:
      - audix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audix -d audix"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: audix-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - audix_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  audix_postgres_data:
  audix_redis_data:
